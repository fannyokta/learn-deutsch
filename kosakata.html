<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>📚 Kosakata · Belajar Jerman</title>

    <!-- Google Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&display=swap"
        rel="stylesheet" />

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>

    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        primary: {
                            50: '#eef2ff',
                            100: '#e0e7ff',
                            200: '#c7d2fe',
                            300: '#a5b4fc',
                            400: '#818cf8',
                            500: '#6366f1',
                            600: '#4f46e5',
                            700: '#4338ca',
                            800: '#3730a3',
                            900: '#312e81',
                        }
                    }
                }
            }
        }
    </script>
</head>

<body class="bg-gray-50 dark:bg-slate-900 text-gray-900 dark:text-gray-100 font-['Inter']">

    <div id="app" class="min-h-screen">

        <!-- ===== SIDEBAR ===== -->
        <div class="sticky top-3 md:top-4 z-50 px-3 md:px-5 pb-2 md:pb-3">
            <header id="sidebarContainer"
                class="relative max-w-6xl mx-auto rounded-full bg-white/70 dark:bg-slate-900/70 backdrop-blur-xl border border-white/60 dark:border-slate-700/60 shadow-lg shadow-slate-900/5 dark:shadow-black/30">
                <!-- diisi oleh components/sidebar.js -->
            </header>
        </div>

        <!-- ===== MAIN CONTENT ===== -->
        <main class="max-w-6xl mx-auto w-full p-6 md:p-9 min-h-screen">

            <section class="page">

                <!-- ===== HERO HEADER ===== -->
                <div
                    class="relative mb-8 overflow-hidden rounded-2xl bg-gradient-to-r from-emerald-500 via-teal-500 to-cyan-500 p-6 md:p-8 text-white shadow-xl">
                    <div
                        class="absolute top-0 right-0 w-64 h-64 bg-white/10 rounded-full -translate-y-1/2 translate-x-1/3">
                    </div>
                    <div
                        class="absolute bottom-0 left-0 w-48 h-48 bg-white/10 rounded-full translate-y-1/2 -translate-x-1/4">
                    </div>

                    <div class="relative z-10">
                        <div class="flex items-center gap-2 mb-2">
                            <span class="text-3xl">📚</span>
                            <span
                                class="bg-white/20 backdrop-blur-sm px-3 py-1 rounded-full text-sm font-medium">Kosakata</span>
                        </div>
                        <h1 class="text-3xl md:text-4xl font-bold mb-2">Kumpulan <span
                                class="text-yellow-300">Kosakata</span> Jerman</h1>
                        <p class="text-white/80 text-base max-w-xl">Kata benda lengkap dengan artikel, plural, dan
                            kategori.</p>

                        <div class="flex flex-wrap items-center gap-4 mt-3">
                            <div
                                class="flex items-center gap-2 bg-white/20 backdrop-blur-sm px-4 py-1.5 rounded-full text-sm">
                                <span class="font-bold" id="totalKataHero">0</span>
                                <span>kata</span>
                            </div>
                            <div
                                class="flex items-center gap-2 bg-white/20 backdrop-blur-sm px-4 py-1.5 rounded-full text-sm">
                                <span class="font-bold" id="totalKategoriHero">0</span>
                                <span>kategori</span>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- ===== STATISTIK CARD ===== -->
                <div class="grid grid-cols-2 md:grid-cols-4 gap-3 mb-6">
                    <div
                        class="bg-white dark:bg-slate-800 rounded-xl p-3 border border-gray-200 dark:border-slate-700 shadow-sm text-center">
                        <div class="text-2xl font-bold text-emerald-600 dark:text-emerald-400" id="statTotal">0</div>
                        <div class="text-xs text-gray-500 dark:text-gray-400">Total Kata</div>
                    </div>
                    <div
                        class="bg-white dark:bg-slate-800 rounded-xl p-3 border border-gray-200 dark:border-slate-700 shadow-sm text-center">
                        <div class="text-2xl font-bold text-blue-600 dark:text-blue-400" id="statTempat">0</div>
                        <div class="text-xs text-gray-500 dark:text-gray-400">🏛️ Tempat</div>
                    </div>
                    <div
                        class="bg-white dark:bg-slate-800 rounded-xl p-3 border border-gray-200 dark:border-slate-700 shadow-sm text-center">
                        <div class="text-2xl font-bold text-amber-600 dark:text-amber-400" id="statOrang">0</div>
                        <div class="text-xs text-gray-500 dark:text-gray-400">👤 Orang</div>
                    </div>
                    <div
                        class="bg-white dark:bg-slate-800 rounded-xl p-3 border border-gray-200 dark:border-slate-700 shadow-sm text-center">
                        <div class="text-2xl font-bold text-red-600 dark:text-red-400" id="statBenda">0</div>
                        <div class="text-xs text-gray-500 dark:text-gray-400">📦 Benda</div>
                    </div>
                </div>

                <!-- ===== FILTER ===== -->
                <div class="flex flex-wrap gap-1.5 mb-4" id="filterBar">
                    <button
                        class="filter-btn active px-4 py-1.5 rounded-full border border-gray-200 dark:border-slate-700 bg-indigo-500 text-white text-sm font-medium shadow-sm shadow-indigo-500/30"
                        data-filter="all">📋 Semua</button>
                    <button
                        class="filter-btn px-4 py-1.5 rounded-full border border-gray-200 dark:border-slate-700 bg-white dark:bg-slate-800 text-gray-600 dark:text-gray-300 text-sm font-medium hover:bg-gray-50 dark:hover:bg-slate-700 transition-all"
                        data-filter="Tempat">🏛️ Tempat</button>
                    <button
                        class="filter-btn px-4 py-1.5 rounded-full border border-gray-200 dark:border-slate-700 bg-white dark:bg-slate-800 text-gray-600 dark:text-gray-300 text-sm font-medium hover:bg-gray-50 dark:hover:bg-slate-700 transition-all"
                        data-filter="Orang">👤 Orang</button>
                    <button
                        class="filter-btn px-4 py-1.5 rounded-full border border-gray-200 dark:border-slate-700 bg-white dark:bg-slate-800 text-gray-600 dark:text-gray-300 text-sm font-medium hover:bg-gray-50 dark:hover:bg-slate-700 transition-all"
                        data-filter="Benda">📦 Benda</button>
                    <button
                        class="filter-btn px-4 py-1.5 rounded-full border border-gray-200 dark:border-slate-700 bg-white dark:bg-slate-800 text-gray-600 dark:text-gray-300 text-sm font-medium hover:bg-gray-50 dark:hover:bg-slate-700 transition-all"
                        data-filter="Abstrak">💭 Abstrak</button>
                </div>

                <!-- ===== SEARCH ===== -->
                <div
                    class="relative flex items-center bg-white dark:bg-slate-800 rounded-full px-4 border-2 border-gray-200 dark:border-slate-700 shadow-sm max-w-md mb-4 focus-within:border-indigo-500 focus-within:shadow-indigo-500/20 transition-all">
                    <i class="fas fa-search text-gray-400 dark:text-gray-500 mr-2 text-sm"></i>
                    <input type="text" id="searchKosakata" placeholder="🔍 Cari kata atau arti..."
                        class="flex-1 border-none outline-none bg-transparent py-2.5 text-sm text-gray-900 dark:text-gray-100 placeholder-gray-400 dark:placeholder-gray-500" />
                    <button id="clearKosakata"
                        class="text-gray-400 dark:text-gray-500 hover:text-gray-600 dark:hover:text-gray-300 hidden px-2">✕</button>
                </div>

                <!-- ===== DATA STATUS ===== -->
                <div class="mb-3" id="dataStatus">
                    <span
                        class="inline-block px-3.5 py-1 rounded-full text-sm font-medium bg-yellow-400 text-yellow-900 dark:bg-yellow-500 dark:text-yellow-900">⏳
                        Memuat data...</span>
                </div>

                <!-- ===== TABEL KOSAKATA ===== -->
                <div
                    class="bg-white dark:bg-slate-800 rounded-xl border border-gray-200 dark:border-slate-700 shadow-sm overflow-hidden">
                    <div class="overflow-x-auto">
                        <div id="artikel-table">
                            <div class="text-center py-12 text-gray-400 dark:text-gray-500">
                                <i class="fas fa-spinner fa-spin text-3xl block mb-3"></i>
                                <span>📖 Memuat kosakata...</span>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- ===== FOOTER INFO ===== -->
                <div class="mt-4 text-xs text-gray-400 dark:text-gray-500 text-center">
                    <i class="fas fa-info-circle"></i> Klik kategori untuk filter • Gunakan pencarian untuk menemukan
                    kata
                </div>

            </section>

        </main>
    </div>

    <!-- ===== KOMPONEN ===== -->
    <script src="components/sidebar.js"></script>
    <script src="scripts/kosakata.js"></script>

    <script>
        document.addEventListener('DOMContentLoaded', function () {
            renderSidebar();
            loadKosakata();
            loadTheme();
        });
    </script>
</body>

</html>
