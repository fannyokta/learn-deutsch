<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>🧩 Tata Bahasa · Belajar Jerman</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&display=swap"
        rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        primary: {
                            50: '#eef2ff',
                            100: '#e0e7ff',
                            200: '#c7d2fe',
                            300: '#a5b4fc',
                            400: '#818cf8',
                            500: '#6366f1',
                            600: '#4f46e5',
                            700: '#4338ca',
                            800: '#3730a3',
                            900: '#312e81',
                        }
                    }
                }
            }
        }
    </script>
</head>

<body class="bg-gray-50 dark:bg-slate-900 text-gray-900 dark:text-gray-100 font-['Inter']">

    <div id="app" class="min-h-screen">

        <!-- ===== SIDEBAR ===== -->
        <div class="sticky top-3 md:top-4 z-50 px-3 md:px-5 pb-2 md:pb-3">
            <header id="sidebarContainer"
                class="relative max-w-6xl mx-auto rounded-full bg-white/70 dark:bg-slate-900/70 backdrop-blur-xl border border-white/60 dark:border-slate-700/60 shadow-lg shadow-slate-900/5 dark:shadow-black/30">
                <!-- diisi oleh components/sidebar.js -->
            </header>
        </div>

        <!-- ===== MAIN CONTENT ===== -->
        <main class="max-w-6xl mx-auto w-full p-6 md:p-9 min-h-screen">

            <section class="page">

                <!-- ===== HERO HEADER ===== -->
                <div
                    class="relative mb-8 overflow-hidden rounded-2xl bg-gradient-to-r from-indigo-500 via-purple-500 to-pink-500 p-6 md:p-8 text-white shadow-xl">
                    <div
                        class="absolute top-0 right-0 w-64 h-64 bg-white/10 rounded-full -translate-y-1/2 translate-x-1/3">
                    </div>
                    <div
                        class="absolute bottom-0 left-0 w-48 h-48 bg-white/10 rounded-full translate-y-1/2 -translate-x-1/4">
                    </div>

                    <div class="relative z-10">
                        <div class="flex items-center gap-2 mb-2">
                            <span class="text-3xl">🧩</span>
                            <span class="bg-white/20 backdrop-blur-sm px-3 py-1 rounded-full text-sm font-medium">Tata
                                Bahasa</span>
                        </div>
                        <h1 class="text-3xl md:text-4xl font-bold mb-2">4 <span class="text-yellow-300">Kasus</span>
                            dalam Bahasa Jerman</h1>
                        <p class="text-white/80 text-base max-w-xl">Fungsi, pertanyaan, dan contoh untuk setiap kasus.
                        </p>
                    </div>
                </div>

                <!-- ===== DATA STATUS ===== -->
                <div class="mb-3" id="dataStatus">
                    <span
                        class="inline-block px-3.5 py-1 rounded-full text-sm font-medium bg-yellow-400 text-yellow-900 dark:bg-yellow-500 dark:text-yellow-900">⏳
                        Memuat data...</span>
                </div>

                <!-- ===== CARDS KASUS ===== -->
                <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4 mb-8" id="kasus-cards">
                    <div class="text-center py-12 text-gray-400 dark:text-gray-500 col-span-full">📖 Memuat kasus...
                    </div>
                </div>

                <!-- ===== TABEL ARTIKEL ===== -->
                <h2 class="text-xl font-bold text-gray-800 dark:text-gray-200 mb-4">📊 Perubahan Artikel berdasarkan
                    Kasus</h2>
                <div
                    class="bg-white dark:bg-slate-800 rounded-xl border border-gray-200 dark:border-slate-700 shadow-sm overflow-hidden">
                    <div class="overflow-x-auto">
                        <div id="kasus-table">
                            <div class="text-center py-12 text-gray-400 dark:text-gray-500">
                                <i class="fas fa-spinner fa-spin text-3xl block mb-3"></i>
                                <span>📖 Memuat tabel kasus...</span>
                            </div>
                        </div>
                    </div>
                </div>

            </section>

        </main>
    </div>

    <!-- ===== KOMPONEN ===== -->
    <script src="components/sidebar.js"></script>
    <script src="scripts/tata-bahasa.js"></script>

    <script>
        document.addEventListener('DOMContentLoaded', function () {
            renderSidebar();
            loadTataBahasa();
            loadTheme();
        });
    </script>
</body>

</html>
