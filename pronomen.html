<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>🔤 Pronomen · Belajar Jerman</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&display=swap"
        rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        primary: {
                            50: '#eef2ff',
                            100: '#e0e7ff',
                            200: '#c7d2fe',
                            300: '#a5b4fc',
                            400: '#818cf8',
                            500: '#6366f1',
                            600: '#4f46e5',
                            700: '#4338ca',
                            800: '#3730a3',
                            900: '#312e81',
                        }
                    }
                }
            }
        }
    </script>
</head>

<body class="bg-gray-50 dark:bg-slate-900 text-gray-900 dark:text-gray-100 font-['Inter']">

    <div id="app" class="flex min-h-screen">

        <!-- ===== SIDEBAR ===== -->
        <aside id="sidebarContainer"
            class="fixed top-0 left-0 w-[220px] h-full bg-white dark:bg-slate-900 border-r border-gray-200 dark:border-slate-700 p-5 flex flex-col z-50 shadow-sm overflow-y-auto">
            <!-- diisi oleh components/sidebar.js -->
        </aside>

        <!-- ===== MAIN CONTENT ===== -->
        <main class="flex-1 ml-[220px] p-7 md:p-9 min-h-screen">

            <section class="page">

                <!-- ===== HERO HEADER ===== -->
                <div
                    class="relative mb-8 overflow-hidden rounded-2xl bg-gradient-to-r from-cyan-500 via-blue-500 to-indigo-500 p-6 md:p-8 text-white shadow-xl">
                    <div
                        class="absolute top-0 right-0 w-64 h-64 bg-white/10 rounded-full -translate-y-1/2 translate-x-1/3">
                    </div>
                    <div
                        class="absolute bottom-0 left-0 w-48 h-48 bg-white/10 rounded-full translate-y-1/2 -translate-x-1/4">
                    </div>

                    <div class="relative z-10">
                        <div class="flex items-center gap-2 mb-2">
                            <span class="text-3xl">🔤</span>
                            <span
                                class="bg-white/20 backdrop-blur-sm px-3 py-1 rounded-full text-sm font-medium">Pronomen</span>
                        </div>
                        <h1 class="text-3xl md:text-4xl font-bold mb-2"><span class="text-yellow-300">Pronomen</span>
                            &amp; Konjugation</h1>
                        <p class="text-white/80 text-base max-w-xl">Personalpronomen dalam 4 kasus, konjugasi <em
                                class="text-yellow-200">machen</em>, dan <em class="text-yellow-200">sein</em>.</p>
                    </div>
                </div>

                <!-- ===== PRONOMEN ===== -->
                <h2 class="text-xl font-bold text-gray-800 dark:text-gray-200 mb-4">👤 Personalpronomen</h2>
                <div
                    class="bg-white dark:bg-slate-800 rounded-xl border border-gray-200 dark:border-slate-700 shadow-sm overflow-hidden mb-8">
                    <div class="overflow-x-auto">
                        <div id="pronomen-table"></div>
                    </div>
                </div>

                <!-- ===== KONJUGASI MACHEN ===== -->
                <h2 class="text-xl font-bold text-gray-800 dark:text-gray-200 mb-4">⚙️ Konjugation Reguler: <span
                        class="text-indigo-600 dark:text-indigo-400">machen</span></h2>
                <div
                    class="bg-white dark:bg-slate-800 rounded-xl border border-gray-200 dark:border-slate-700 shadow-sm overflow-hidden mb-8">
                    <div class="overflow-x-auto">
                        <div id="endungen-table"></div>
                    </div>
                </div>

                <!-- ===== KONJUGASI SEIN ===== -->
                <h2 class="text-xl font-bold text-gray-800 dark:text-gray-200 mb-4">✅ Konjugation Iregular: <span
                        class="text-emerald-600 dark:text-emerald-400">sein</span> (adalah)</h2>
                <div
                    class="bg-white dark:bg-slate-800 rounded-xl border border-gray-200 dark:border-slate-700 shadow-sm overflow-hidden">
                    <div class="overflow-x-auto">
                        <div id="sein-table"></div>
                    </div>
                </div>

            </section>

        </main>
    </div>

    <!-- ===== KOMPONEN ===== -->
    <script src="components/sidebar.js"></script>

    <script>
        // ============================================================
        //  PRONOMEN - Hardcode (tanpa JSON)
        // ============================================================

        function renderPronomen() {
            const data = [
                ['ich (saya)', 'meiner', 'mir', 'mich'],
                ['du (kamu)', 'deiner', 'dir', 'dich'],
                ['er (dia lk)', 'seiner', 'ihm', 'ihn'],
                ['sie (dia pr)', 'ihrer', 'ihr', 'sie'],
                ['es (dia netral)', 'seiner', 'ihm', 'es'],
                ['wir (kami)', 'unser', 'uns', 'uns'],
                ['ihr (kalian)', 'euer', 'euch', 'euch'],
                ['sie (mereka)', 'ihrer', 'ihnen', 'sie'],
                ['Sie (Anda formal)', 'Ihrer', 'Ihnen', 'Sie']
            ];

            let html = `
                <table class="w-full text-sm">
                    <thead>
                        <tr class="bg-gradient-to-r from-cyan-500 to-blue-500">
                            <th class="text-left px-4 py-3.5 text-white font-semibold text-xs uppercase tracking-wider rounded-tl-lg">Nominativ</th>
                            <th class="text-left px-4 py-3.5 text-white font-semibold text-xs uppercase tracking-wider">Genitiv</th>
                            <th class="text-left px-4 py-3.5 text-white font-semibold text-xs uppercase tracking-wider">Dativ</th>
                            <th class="text-left px-4 py-3.5 text-white font-semibold text-xs uppercase tracking-wider rounded-tr-lg">Akkusativ</th>
                        </tr>
                    </thead>
                    <tbody class="divide-y divide-gray-100 dark:divide-slate-700 bg-white dark:bg-slate-800">
            `;

            data.forEach((d, index) => {
                const bgRow = index % 2 === 0 ? 'bg-white dark:bg-slate-800' : 'bg-gray-50/70 dark:bg-slate-800/70';
                html += `
                    <tr class="${bgRow} hover:bg-indigo-50/70 dark:hover:bg-indigo-900/20 transition-colors duration-150">
                        <td class="px-4 py-3.5 font-semibold text-gray-800 dark:text-gray-100">${d[0]}</td>
                        <td class="px-4 py-3.5 text-gray-600 dark:text-gray-300">${d[1]}</td>
                        <td class="px-4 py-3.5 text-gray-600 dark:text-gray-300">${d[2]}</td>
                        <td class="px-4 py-3.5 text-gray-600 dark:text-gray-300">${d[3]}</td>
                    </tr>
                `;
            });

            html += `
                    </tbody>
                </table>
            `;

            document.getElementById('pronomen-table').innerHTML = html;
        }

        function renderEndungen() {
            const data = [
                ['ich', '-e', 'ich mache'],
                ['du', '-st', 'du machst'],
                ['er/sie/es', '-t', 'er macht'],
                ['wir', '-en', 'wir machen'],
                ['ihr', '-t', 'ihr macht'],
                ['sie/Sie', '-en', 'sie machen']
            ];

            let html = `
                <table class="w-full text-sm">
                    <thead>
                        <tr class="bg-gradient-to-r from-emerald-500 to-teal-500">
                            <th class="text-left px-4 py-3.5 text-white font-semibold text-xs uppercase tracking-wider rounded-tl-lg">Pronomen</th>
                            <th class="text-left px-4 py-3.5 text-white font-semibold text-xs uppercase tracking-wider">Endung</th>
                            <th class="text-left px-4 py-3.5 text-white font-semibold text-xs uppercase tracking-wider rounded-tr-lg">Contoh</th>
                        </tr>
                    </thead>
                    <tbody class="divide-y divide-gray-100 dark:divide-slate-700 bg-white dark:bg-slate-800">
            `;

            data.forEach((d, index) => {
                const bgRow = index % 2 === 0 ? 'bg-white dark:bg-slate-800' : 'bg-gray-50/70 dark:bg-slate-800/70';
                html += `
                    <tr class="${bgRow} hover:bg-indigo-50/70 dark:hover:bg-indigo-900/20 transition-colors duration-150">
                        <td class="px-4 py-3.5 font-medium text-gray-800 dark:text-gray-100">${d[0]}</td>
                        <td class="px-4 py-3.5 text-indigo-600 dark:text-indigo-400 font-medium">${d[1]}</td>
                        <td class="px-4 py-3.5 text-gray-600 dark:text-gray-300 italic">${d[2]}</td>
                    </tr>
                `;
            });

            html += `
                    </tbody>
                </table>
            `;

            document.getElementById('endungen-table').innerHTML = html;
        }

        function renderSein() {
            const data = [
                ['ich', 'bin'],
                ['du', 'bist'],
                ['er/sie/es', 'ist'],
                ['wir', 'sind'],
                ['ihr', 'seid'],
                ['sie/Sie', 'sind']
            ];

            let html = `
                <table class="w-full text-sm">
                    <thead>
                        <tr class="bg-gradient-to-r from-amber-500 to-orange-500">
                            <th class="text-left px-4 py-3.5 text-white font-semibold text-xs uppercase tracking-wider rounded-tl-lg">Pronomen</th>
                            <th class="text-left px-4 py-3.5 text-white font-semibold text-xs uppercase tracking-wider rounded-tr-lg">sein</th>
                        </tr>
                    </thead>
                    <tbody class="divide-y divide-gray-100 dark:divide-slate-700 bg-white dark:bg-slate-800">
            `;

            data.forEach((d, index) => {
                const bgRow = index % 2 === 0 ? 'bg-white dark:bg-slate-800' : 'bg-gray-50/70 dark:bg-slate-800/70';
                html += `
                    <tr class="${bgRow} hover:bg-indigo-50/70 dark:hover:bg-indigo-900/20 transition-colors duration-150">
                        <td class="px-4 py-3.5 font-medium text-gray-800 dark:text-gray-100">${d[0]}</td>
                        <td class="px-4 py-3.5 font-bold text-emerald-600 dark:text-emerald-400">${d[1]}</td>
                    </tr>
                `;
            });

            html += `
                    </tbody>
                </table>
            `;

            document.getElementById('sein-table').innerHTML = html;
        }

        // ============================================================
        //  INIT
        // ============================================================
        document.addEventListener('DOMContentLoaded', function () {
            renderSidebar();
            renderPronomen();
            renderEndungen();
            renderSein();
            loadTheme();
        });
    </script>
</body>

</html>
