<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>📖 Pelajaran · Belajar Jerman</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&display=swap"
        rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        primary: {
                            50: '#eef2ff',
                            100: '#e0e7ff',
                            200: '#c7d2fe',
                            300: '#a5b4fc',
                            400: '#818cf8',
                            500: '#6366f1',
                            600: '#4f46e5',
                            700: '#4338ca',
                            800: '#3730a3',
                            900: '#312e81',
                        }
                    }
                }
            }
        }
    </script>
</head>

<body class="bg-gray-50 dark:bg-slate-900 text-gray-900 dark:text-gray-100 font-['Inter']">

    <div id="app" class="flex min-h-screen">

        <!-- ===== SIDEBAR ===== -->
        <aside id="sidebarContainer"
            class="fixed top-0 left-0 w-[220px] h-full bg-white dark:bg-slate-900 border-r border-gray-200 dark:border-slate-700 p-5 flex flex-col z-50 shadow-sm overflow-y-auto">
            <!-- diisi oleh components/sidebar.js -->
        </aside>

        <!-- ===== MAIN CONTENT ===== -->
        <main class="flex-1 ml-[220px] p-7 md:p-9 min-h-screen">

            <section class="page">

                <!-- ===== HERO HEADER ===== -->
                <div
                    class="relative mb-8 overflow-hidden rounded-2xl bg-gradient-to-r from-amber-500 via-orange-500 to-red-500 p-6 md:p-8 text-white shadow-xl">
                    <div
                        class="absolute top-0 right-0 w-64 h-64 bg-white/10 rounded-full -translate-y-1/2 translate-x-1/3">
                    </div>
                    <div
                        class="absolute bottom-0 left-0 w-48 h-48 bg-white/10 rounded-full translate-y-1/2 -translate-x-1/4">
                    </div>

                    <div class="relative z-10">
                        <div class="flex items-center gap-2 mb-2">
                            <span class="text-3xl">📖</span>
                            <span
                                class="bg-white/20 backdrop-blur-sm px-3 py-1 rounded-full text-sm font-medium">Pelajaran</span>
                        </div>
                        <h1 class="text-3xl md:text-4xl font-bold mb-2">Yang Sudah <span class="text-yellow-300">Aku
                                Pelajari</span></h1>
                        <p class="text-white/80 text-base max-w-xl">Kumpulan pertanyaan dan jawaban dalam bahasa Jerman
                            (formal &amp; informal).</p>
                    </div>
                </div>

                <!-- ===== FILTER ===== -->
                <div class="flex flex-wrap gap-1.5 mb-4" id="filterBar">
                    <button
                        class="filter-btn active px-4 py-1.5 rounded-full border border-gray-200 dark:border-slate-700 bg-indigo-500 text-white text-sm font-medium shadow-sm shadow-indigo-500/30"
                        data-filter="all">📋 Semua</button>
                </div>

                <!-- ===== SEARCH ===== -->
                <div
                    class="relative flex items-center bg-white dark:bg-slate-800 rounded-full px-4 border-2 border-gray-200 dark:border-slate-700 shadow-sm max-w-md mb-4 focus-within:border-indigo-500 focus-within:shadow-indigo-500/20 transition-all">
                    <i class="fas fa-search text-gray-400 dark:text-gray-500 mr-2 text-sm"></i>
                    <input type="text" id="searchPelajaran" placeholder="🔍 Cari pertanyaan, jawaban, atau kategori..."
                        class="flex-1 border-none outline-none bg-transparent py-2.5 text-sm text-gray-900 dark:text-gray-100 placeholder-gray-400 dark:placeholder-gray-500" />
                    <button id="clearPelajaran"
                        class="text-gray-400 dark:text-gray-500 hover:text-gray-600 dark:hover:text-gray-300 hidden px-2">✕</button>
                </div>

                <!-- ===== DATA STATUS ===== -->
                <div class="mb-3" id="dataStatus">
                    <span
                        class="inline-block px-3.5 py-1 rounded-full text-sm font-medium bg-yellow-400 text-yellow-900 dark:bg-yellow-500 dark:text-yellow-900">⏳
                        Memuat data...</span>
                </div>

                <!-- ===== KONTEN ===== -->
                <div id="pelajaran-container">
                    <div class="text-center py-12 text-gray-400 dark:text-gray-500">
                        <i class="fas fa-spinner fa-spin text-3xl block mb-3"></i>
                        <span>📖 Memuat pelajaran...</span>
                    </div>
                </div>

            </section>

        </main>
    </div>

    <!-- ===== KOMPONEN ===== -->
    <script src="components/sidebar.js"></script>
    <script src="scripts/pelajaran.js"></script>

    <script>
        document.addEventListener('DOMContentLoaded', function () {
            renderSidebar();
            loadPelajaran();
            loadTheme();
        });
    </script>
</body>

</html>
